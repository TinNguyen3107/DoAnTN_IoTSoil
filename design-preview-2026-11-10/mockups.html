<script>

const farmerNav=[['Giám sát','monitor'],['Trạm đo','devices'],['Lịch sử','history'],['Nhật ký','logs'],['Tư vấn','fertilizer'],['Cảnh báo','alerts']];
const nav=(active)=>`<header class="topnav">${brand()}<nav>${farmerNav.map(([t,v])=>`<a class="navlink ${active===v||(active==='crops'&&v==='fertilizer')?'active':''}" href="?view=${v}">${t}${v==='alerts'?'<span class="navcount">2</span>':''}</a>`).join('')}</nav><div class="flex" style="gap:11px"><span class="avatar">MA</span><span style="font-size:12px">Minh An<br><small class="muted">Nông dân</small></span><button aria-label="Đăng xuất" data-view="login">${icon('logout')}</button></div></header>`;

const npk=()=>`<div class="npk-row">${[['N','Đạm','42','amber'],['P','Lân','48',''],['K','Kali','126','']].map(([s,n,v,c])=>`<div class="npk-item"><span>${s} · ${n}</span><strong>${v}</strong><span>mg/kg</span></div>`).join('')}</div>`;
function monitor(){return nav('monitor')+`<main class="farmer-main">${title('Thứ Ba, 10 tháng 11 năm 2026','Hiểu đất, chăm mùa.','Theo dõi đất hôm nay để chăm sóc đúng lúc.',pick())}<div class="monitor-grid"><section><div class="field-photo"><img src="assets/rice-field.png" alt="Ruộng lúa, ảnh minh họa"><span class="photo-label">Không gian đồng ruộng · Ảnh minh họa</span></div><div class="field-caption"><h2>Trạm ruộng lúa 01</h2>${tag('Cố định')}</div><div class="field-facts"><span>Mã trạm #001</span><span>Đo lúc 09:40</span></div><div class="field-message">${tag('Đã nhận dữ liệu')}<p style="margin-top:10px">Tự động cập nhật mỗi 10 giây.<br>Dữ liệu gần nhất từ trạm quan trắc.</p></div></section><section><div class="reading-head"><span class="eyebrow">Mẫu đất gần nhất</span><small class="muted">10/11 · 09:40</small></div><div class="big-reading"><div><span class="small muted">Độ ẩm đất</span><div class="reading-value num">68<span>%</span></div><div class="range-track" style="--fill:63%"></div><small class="muted">Trong khoảng 50–80%</small></div><div><span class="small muted">Độ pH</span><div class="reading-value num">6,2</div><div class="range-track" style="--fill:51%"></div><small class="muted">Trong khoảng 5,5–7,0</small></div></div><div class="metric-strip"><div><small>Nhiệt độ đất</small><strong>27,4 <span class="small muted">°C</span></strong></div><div><small>Độ dẫn điện · EC</small><strong>820 <span class="small muted">µS/cm</span></strong></div></div><div class="between" style="margin-top:20px"><h3 style="font-size:13px;font-weight:500">Dinh dưỡng trong đất</h3><small class="muted">N · P · K</small></div>${npk()}<p class="small muted" style="margin-top:21px"><span style="color:#9b7431">●</span> Đạm thấp hơn ngưỡng 50 mg/kg.</p></section><aside class="advice-rail"><div class="eyebrow">Điều cần lưu ý</div><div class="rail-callout">${tag('Cần bổ sung đạm','amber')}<h2>Đất đang<br>thiếu một chút N.</h2><p>Độ ẩm và pH ổn định. Hãy xem lượng phân bón gợi ý trước k const adminNav=[['grid','Tổng quan','admin'],['station','Trạm đo & khóa API','admin-devices'],['chart','Giám sát đất','admin-monitor'],['bell','Cảnh báo','admin-alerts'],['settings','Ngưỡng cảnh báo','thresholds'],['users','Người dùng','users'],['settings','Tham số nông học','settings']];
function adminShell(active,content){return `<div class="admin-shell"><aside class="sidebar">${brand()}<div class="side-role">KHÔNG GIAN QUẢN TRỊ</div><span class="eyebrow">Vận hành</span>${adminNav.slice(0,5).map(([i,t,v])=>`<a href="?view=${v}" class="side-link ${active===v?'active':''}">${icon(i)}${t}</a>`).join('')}<span class="eyebrow">Hệ thống</span>${adminNav.slice(5).map(([i,t,v])=>`<a href="?view=${v}" class="side-link ${active===v?'active':''}">${icon(i)}${t}</a>`).join('')}<span class="eyebrow">Dữ liệu canh tác</span>${[['chart','Lịch sử & báo cáo','admin-history'],['book','Nhật ký canh tác','admin-logs'],['leaf','Tư vấn nông nghiệp','admin-fertilizer']].map(([i,t,v])=>`<a href="?view=${v}" class="side-link ${active===v?'active':''}">${icon(i)}${t}</a>`).join('')}<div class="sidebar-bottom"><span class="avatar">QT</span><div><strong>Quản trị viên</strong><br><small class="muted">Quản lý hệ thống</small></div><a href="?view=login" aria-label="Đăng xuất">${icon('logout')}</a></div></aside><div><header class="admin-top"><span>Không gian quản trị <span class="muted">/ ${names[active]||'Dữ liệu canh tác'}</span></span><div class="flex"><span class="muted">Thứ Ba, 10/11/2026</span>${icon('bell')}</div></header><main class="admin-main">${content}</main></div></div>`+foot('A · SỔ TAY ĐỒNG RUỘNG / QUẢN TRỊ VIÊN');}

g dân sử dụng các chức năng canh tác và quản lý trạm thuộc tài khoản.</p>${btn('Cập nhật vai trò','check','primary')}<div class="rule" style="margin-top:30px;padding-top:22px"><h3 style="font-size:14px;margin-bottom:11px">Trạng thái tài khoản</h3><p>Khóa tài khoản để tạm ngừng quyền truy cập.</p>${btn('Khóa tài khoản','shield','danger')}</div></aside></div>`);}
function thresholds(){return adminShell('thresholds',title('Cấu hình giám sát','Đặt giới hạn để cảnh báo đúng lúc.','Các chỉ số ngoài khoảng cho phép sẽ tạo cảnh báo.',btn('Lưu ngưỡng','check','primary'))+`<div class="notice" style="margin-bottom:27px">Ngưỡng được cấu hình trong phạm vi hiện có của hệ thống; bản mẫu không bổ sung cấu hình riêng theo mùa vụ.</div><div class="two-cols" style="grid-template-columns:1fr 250px"><section><table class="table threshold-table"><thead><tr><th>Chỉ số</th><th>Tối thiểu</th><th>Khoảng tham chiếu</th><th>Tối đa</th></tr></thead><tbody>${[['Độ pH','5.5','7.0','Không có đơn vị'],['Độ dẫn điện · EC','300','1200','µS/cm'],['Đạm · N','50','150','mg/kg'],['Lân · P','30','80','mg/kg'],['Kali · K','80','200','mg/kg'],['Nhiệt độ đất','18','35','°C'],['Độ ẩm đất','50','80','%']].map(([n,lo,hi,u])=>`<tr><td><strong>${n}</strong><small>${u}</small></td><td><input aria-label="${n} tối thiểu" type="number" value="${lo}" step="0.1"></td><td><div class="range-band"><i></i></div></td><td><input aria-label="${n} tối đa" type="number" value="${hi}" step="0.1"></td></tr>`).join('')}</tbody></table></section><aside class="detail-side"><div class="eyebrow">Nguyên tắc cấu hình</div><h2>Một khoảng<br>rõ ràng.</h2><p>Giá trị tối thiểu phải nhỏ hơn giá trị tối đa. Kiểm tra đơn vị của từng chỉ số trước khi lưu.</p><div style="padding:20px 0;border-top:1px solid var(--line)"><h3 style="font-size:13px;margin-bottom:12px">Bộ ngưỡng mặc định</h3><p>Khôi phục các giá trị mặc định, sau đó điều chỉnh theo nhu cầu.</p>${btn('Dùng mặc định','refresh')}</div></aside></div>`);}
function settings(){return adminShell('settings',title('Cài đặt hệ thống','Những con số phía sau khuyến nghị.','Quản lý các hệ số dùng để quy đổi lượng phân bón.',btn('Lưu tham số','check','primary'))+`<div class="settings-section"><div><h2>Hàm lượng phân bón</h2><p>Tỷ lệ dinh dưỡng trong phân thương phẩm.<br>Đơn vị tính: phần trăm (%).</p></div><div class="settings-three">${[['Urê · N','46'],['Supe lân · P₂O₅','16'],['Kali clorua · K₂O','60']].map(([n,v])=>`<label class="field"><span>${n}</span><div class="unit-input"><input type="number" value="${v}" min="0" max="100"><b>%</b></div></label>`).join('')}</div></div><div class="settings-section"><div><h2>Tầng đất canh tác</h2><p>Thông số phục vụ ước tính khối lượng đất trong phạm vi tính toán.</p></div><div class="settings-three" style="grid-template-columns:1fr 1fr"><label class="field"><span>Độ sâu tầng đất</span><div class="unit-input"><input type="number" value="0.2" step="0.1"><b>m</b></div></label><label class="field"><span>Khối lượng thể tích đất</span><div class="unit-input"><input type="number" value="1.3" step="0.1"><b>tấn/m³</b></div></label></div></div><div class="settings-section"><div><h2>Quy đổi diện tích</h2><p>Hệ số chuyển đổi hecta sang mét vuông.</p></div><label class="field" style="max-width:310px"><span>Diện tích trên một hecta</span><div class="unit-input"><input type="number" value="10000"><b>m²/ha</b></div></label></div><div class="notice" style="margin-top:20px">Các thay đổi ảnh hưởng đến kết quả tính lượng phân bón. Chỉ cập nhật khi đã kiểm tra cơ sở nông học và đơn vị quy đổi.</div><div class="quiet-banner" style="margin-top:35px"><div class="flex">${icon('shield')}<div><strong>Chỉ dành cho quản trị viên</strong><p class="small muted">Nông dân không thấy chức năng chỉnh sửa các hệ số này.</p></div></div>${btn('Xem tư vấn mẫu','arrow','text','admin-fertilizer')}</div>`);}
function auth(register=false){return `<div class="auth"><aside class="auth-art"><img src="assets/rice-field.png" alt="Ảnh minh họa ruộng lúa vào buổi sáng">${brand()}<div class="auth-copy"><span class="eyebrow">GIÁM SÁT ĐẤT · CHĂM SÓC MÙA VỤ</span><h1>Hiểu từ đất.<br>Tốt cho mùa.</h1><p>Theo dõi chất lượng đất, lưu nhật ký canh tác và tham khảo lượng phân bón phù hợp.</p></div><div class="auth-corner">Nền tảng IoT giám sát đa chế độ chất lượng đất và tối ưu phân bón</div></aside><section class="auth-form"><div class="auth-top">AgroPrecision / Không gian canh tác</div><div class="auth-form-inner"><span class="eyebrow">${register?'BẮT ĐẦU HÀNH TRÌNH':'CHÀO MỪNG TRỞ LẠI'}</span><h1>${register?'Tạo tài khoản của bạn.':'Tiếp tục chăm mùa.'}</h1><p>${register?'Đăng ký tài khoản nông dân để quản lý trạm đo.':'Đăng nhập để theo dõi đất và các trạm đo của bạn.'}</p>${register?'<label class="field"><span>Họ và tên</span><input placeholder="Nhập họ và tên" autocomplete="name"></label>':''}<label class="field"><span>Email</span><input placeholder="Nhập địa chỉ email" type="email" autocomplete="email"></label><label class="field"><span>Mật khẩu</span><input type="password" placeholder="Nhập mật khẩu" autocomplete="${register?'new-password':'current-password'}"></label>${register?'<label class="field"><span>Xác nhận mật khẩu</span><input type="password" placeholder="Nhập lại mật khẩu" autocomplete="new-password"></label>':''}${btn(register?'Tạo tài khoản':'Đăng nhập','arrow','primary')}<p class="join">${register?'Đã có tài khoản?':'Chưa có tài khoản?'} <a href="?view=${register?'login':'register'}">${register?'Đăng nhập':'Đăng ký ngay'}</a></p></div><div class="auth-bottom">${icon('shield')} <span style="margin-left:7px">Quyền truy cập được xác định theo tài khoản đăng nhập.</span></div></section></div>`+foot('A / DÙNG CHUNG · '+(register?'ĐĂNG KÝ':'ĐĂNG NHẬP'));}
function lab(){return `<div class="lab" style="height:100%">${nav('monitor')}<main class="lab-main"><div class="lab-head"><div><span class="eyebrow">KHÔNG GIAN QUAN TRẮC / NÔNG DÂN</span><h1>Đất hôm nay, nhìn thật rõ.</h1><p class="small muted">Thứ Ba, 10/11/2026 · Cập nhật mỗi 10 giây</p></div>${pick()}</div><div class="lab-brief"><span class="badge-circle">${icon('soil')}</span><div style="flex:1"><h3>Đất thiếu đạm. Các chỉ số khác trong khoảng an toàn.</h3><p>Mẫu đo 09:40 · Trạm ruộng lúa 01 · Chế độ cố định</p></div>${btn('Xem tư vấn','arrow','primary','fertilizer')}</div><div class="lab-grid"><aside class="lab-sensors"><span class="eyebrow">Hiện trạng</span><div><small>Độ pH</small><strong>6,2</strong><small>Ngưỡng 5,5–7,0</small></div><div><small>Nhiệt độ đất</small><strong>27,4 <small>°C</small></strong></div><div><small>Độ dẫn điện · EC</small><strong>820</strong><small>µS/cm</small></div></aside><section class="lab-chart"><div class="between"><div><span class="eyebrow">Độ ẩm đất</span><h2>Biến thiên trong 24 giờ</h2></div><div class="reading-value">68<span>%</span></div></div>${chart(true)}<div class="between small muted"><span><span style="color:var(--green)">●</span> Ngưỡng tham chiếu 50–80%</span><a href="?view=history">Mở lịch sử & xuất CSV ↗</a></div></section><aside class="lab-aside"><span class="eyebrow">Nồng độ N · P · K</span>${npk()}<div class="notice" style="padding:12px;font-size:12px">N = 42 mg/kg<br>Thấp hơn ngưỡng 50 mg/kg.</div></aside></div><div class="lab-bottom"><section><h3>Thiết bị gần nhất</h3><div class="inline-row"><div>Trạm ruộng lúa 01<p>Cố định · Nhận lúc 09:40</p></div>${tag('Đang hoạt động')}</div><div class="inline-row"><div>Máy đo cầm tay 02<p>Cầm tay · Nhận lúc 08:15</p></div><a href="?view=handheld">${icon('arrow')}</a></div></section><section><div class="between"><h3>Dấu mốc canh tác</h3><a href="?view=logs" class="row-action">Ghi nhật ký +</a></div><div class="inline-row"><div>08/11 · Bón thúc<p>12 kg/sào · Trạm ruộng lúa 01</p></div>${icon('book')}</div><p style="margin-top:18px">Nhìn dữ liệu trước, mở chi tiết khi cần. Giữ không gian làm việc tập trung vào số đo và thời điểm.</p></section></div></main>${foot('B · TRẠM QUAN TRẮC / NÔNG DÂN')}</div>`;}
function harvest(){return `<div class="harvest" style="height:100%"><div class="harvest-shell"><aside class="harvest-side">${brand()}<div class="side-role">KHÔNG GIAN CANH TÁC</div>${[['soil','Đất hôm nay','harvest'],['station','Trạm của tôi','devices'],['chart','Lịch sử số đo','history'],['book','Sổ canh tác','logs'],['leaf','Tư vấn cây trồng','crops'],['bell','Cảnh báo','alerts']].map(([i,t,v])=>`<a class="side-link ${v==='harvest'?'active':''}" href="?view=${v}">${icon(i)}${t}</a>`).join('')}<div class="sidebar-bottom"><span class="avatar" style="background:#e8d5b8">MA</span><div><strong>Minh An</strong><br><small class="muted">Nông dân</small></div></div></aside><main class="harvest-main"><header><span>Thứ Ba, 10 tháng 11 năm 2026</span><div class="flex"><span>Trạm ruộng lúa 01</span>${icon('chevron')}</div></header><section class="harvest-hero"><div><span class="eyebrow">NHỊP ĐẤT / NHỊP MÙA</span><h1>Một ngày mới<br>từ lòng đất.</h1><p>Độ ẩm ổn định, pH trong ngưỡng. Đạm đang thấp và cần được lưu ý.</p><div style="margin-top:20px">${btn('Tham khảo lượng phân','arrow','primary','fertilizer')}</div></div><div class="field-photo"><img src="assets/rice-field.png" alt="Ruộng lúa, ảnh minh họa"><span class="photo-label">Mẫu đo mới nhất · 09:40</span></div></section><section class="harvest-numbers">${[['Độ ẩm','68','%'],['Độ pH','6,2','Trong ngưỡng'],['Nhiệt độ','27,4','°C'],['Độ dẫn điện','820','µS/cm']].map(([t,v,u])=>`<div><small>${t}</small><strong>${v}</strong><small>${u}</small></div>`).join('')}</section><div class="harvest-bottom"><section><div class="between"><h2>Theo nhịp thời gian</h2><small class="muted">Độ ẩm · 24 giờ</small></div>${chart()}<div class="harvest-npk"><span>N <strong>42</strong> <small>mg/kg</small></span><span>P <strong>48</strong> <small>mg/kg</small></span><span>K <strong>126</strong> <small>mg/kg</small></span></div><p class="small muted" style="margin-top:13px">Đạm dưới ngưỡng · Lân và kali trong ngưỡng.</p></section><aside style="border-left:1px solid var(--line);padding-left:30px"><div class="eyebrow">GHI CHÉP ĐỒNG RUỘNG</div><h2 style="margin:13px 0 18px">Chăm chút từng lần.</h2><div class="inline-row"><div><strong>08/11 · Bón thúc</strong><p>12 kg/sào · Trạm ruộng lúa 01</p></div>${icon('book')}</div><div class="inline-row"><div><strong>05/11 · Bón lót</strong><p>18 kg/sào · Trạm ruộng lúa 01</p></div>${icon('book')}</div><div style="margin-top:22px">${btn('Thêm một ghi chép','plus','text','logs')}</div></aside></div></main></div>${foot('C · MÙA VỤ / NÔNG DÂN')}</div>`;}
function handheld(){return nav('monitor')+`<main class="farmer-main">${title('Thiết bị cầm tay','Một mẫu đo, ngay tại thực địa.','Nút đo nằm trên thiết bị; website hiển thị dữ liệu được đồng bộ.',pick('Máy đo cầm tay 02'))}<div class="notice" style="margin-bottom:30px">Mẫu gần nhất được nhận lúc 08:15. Đây không phải số đo liên tục. Khi thiết bị chưa đồng bộ, hệ thống giữ nguyên thời điểm của mẫu cũ.</div><div class="two-cols" style="grid-template-columns:1fr 370px;gap:45px"><section><div class="between"><h2>Kết quả lần đo gần nhất</h2>${tag('Đo thủ công')}</div><div class="big-reading" style="margin-top:20px"><div><span class="small muted">Độ ẩm đất</span><div class="reading-value">42<span>%</span></div>${tag('Dưới ngưỡng 50%','amber')}</div><div><span class="small muted">Độ pH</span><div class="reading-value">6,1</div>${tag('Trong ngưỡng')}</div></div><div class="metric-strip"><div><small>Nhiệt độ</small><strong>28,1 °C</strong></div><div><small>Độ dẫn điện</small><strong>790 µS/cm</strong></div></div>${npk()}<div style="margin-top:30px">${btn('Mở lịch sử số đo','chart','','history')}</div></section><aside class="detail-side"><span class="eyebrow">Khi chưa có dữ liệu</span><div class="empty" style="margin-top:19px">${icon('station')}<h2>Chưa nhận mẫu đo.</h2><p>Bật thiết bị, thực hiện lần đo đầu tiên và kết nối Wi-Fi để đồng bộ.</p>${btn('Kiểm tra trạm đo','arrow','','devices')}</div><p class="small muted" style="margin-top:20px">Minh họa trạng thái trống. Không hiển thị các giá trị 0 như thể đó là kết quả đo.</p></aside></div></main>`+foot('A / NÔNG DÂN · CẦM TAY & TRẠNG THÁI TRỐNG');}
const names={monitor:'01 · A — Giám sát của nông dân',lab:'02 · B — Trạm quan trắc',harvest:'03 · C — Mùa vụ',admin:'04 · Tổng quan quản trị',fertilizer:'05 · Tư vấn phân bón',crops:'06 · Cây trồng phù hợp',history:'07 · Lịch sử & CSV',logs:'08 · Nhật ký canh tác',alerts:'09 · Xử lý cảnh báo',devices:'10 · Trạm đo của nông dân','admin-devices':'11 · Quản lý trạm toàn hệ thống',users:'12 · Người dùng & phân quyền',thresholds:'13 · Ngưỡng cảnh báo',settings:'14 · Tham số nông học',login:'15 · Đăng nhập',register:'16 · Đăng ký',handheld:'17 · Cầm tay & trạng thái trống'};
const screens={monitor,lab,harvest,admin,fertilizer,crops,history:historyScreen,logs,alerts,devices,'admin-devices':()=>adminShell('admin-devices',deviceContent(true)),users,thresholds,settings,login:()=>auth(),register:()=>auth(true),handheld};
const select=document.getElementById('view-select');Object.entries(names).forEach(([value,text])=>{const o=document.createElement('option');o.value=value;o.textContent=text;select.append(o)});
function render(view){if(view.startsWith('admin-')&&!screens[view]){const base=view.slice(6);const tmp=document.createElement('div');tmp.innerHTML=(screens[base]||monitor)();document.getElementById('screen').innerHTML=adminShell(view,tmp.querySelector('main').innerHTML);}else document.getElementById('screen').innerHTML=(screens[view]||monitor)();select.value=view;document.title='AgroPrecision · '+(names[view]||view);window.currentView=view;}
select.addEventListener('change',()=>{historyState(select.value)});function historyState(v){window.history.replaceState(null,'','?view='+encodeURIComponent(v));render(v)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)historyState(b.dataset.view)});render(new URLSearchParams(location.search).get('view')||'monitor');
</script>
</body>
